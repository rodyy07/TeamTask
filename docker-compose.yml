services:
  postgres:
    image: postgres:16
    container_name: teamtask-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: teamtask
      POSTGRES_USER: teamtask
      POSTGRES_PASSWORD: teamtask
    ports:
      - "5433:5432"
    volumes:
      - teamtask_data:/var/lib/postgresql/data
volumes:
  teamtask_data:
