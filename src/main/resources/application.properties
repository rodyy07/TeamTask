spring.application.name=teamtask-manager
server.port=8080

# Connect to the Docker PostgreSQL instance on host port 5433.
spring.datasource.url=jdbc:postgresql://127.0.0.1:5433/teamtask
spring.datasource.username=teamtask-postgres
spring.datasource.password=teamtask
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=true
spring.jpa.show-sql=true

spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

app.jwt.secret=change-this-secret-key-to-a-long-random-string-at-least-32-bytes
app.jwt.expiration-ms=86400000
app.upload-dir=uploads
